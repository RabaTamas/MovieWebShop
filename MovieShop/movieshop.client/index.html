<!doctype html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Buy, stream and bid on movies — and watch together with friends." />
    <meta name="theme-color" content="#0f0f14" />
    <!-- iOS: telepített (főképernyős) módban teljes képernyős megjelenés -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MovieShop" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>MovieWebShop</title>
    <script>
        // A mentett téma alkalmazása még a React betöltése előtt (villanás nélkül)
        try {
            if (localStorage.getItem('movieshop-theme') === 'light') document.documentElement.classList.remove('dark');
        } catch (e) { /* alapértelmezés: sötét */ }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
