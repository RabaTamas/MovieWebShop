# ==============================================
# Nginx Configuration for React SPA (PWA)
# ==============================================

server {
    # Listen on port 80 (HTTP)
    listen 80;

    # Server name (use localhost or your domain)
    server_name localhost;

    # Root directory where the React build files are located
    root /usr/share/nginx/html;

    # Default file to serve
    index index.html;

    # Enable gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/manifest+json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── PWA: ezeket soha nem szabad a böngészőnek hosszan cache-elnie ──────────
    # Service Worker: ha a böngésző régi sw.js-t tartana meg, az új verzió sosem települne.
    # (A pontos egyezés "=" elsőbbséget élvez a lenti .js regex szabállyal szemben.)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        expires -1;
        try_files $uri =404;
    }

    # Web App Manifest (az nginx alap mime.types nem ismeri a .webmanifest kiterjesztést)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Az index.html mindig friss legyen (a hash-elt assetekre ez hivatkozik)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    # Main location block - serve React app
    location / {
        # Try to serve the requested file, fallback to index.html
        # This is essential for React Router to work correctly
        try_files $uri $uri/ /index.html;

        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Vite által tartalom-hash-sel elnevezett fájlok: nyugodtan cache-elhetők örökre
    # (^~: különben a lenti .js/.css regex szabály nyerne ezen az útvonalon is)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Egyéb statikus fájlok (ikonok, workbox runtime): hash nélküliek is lehetnek → rövidebb cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Health check endpoint (optional, useful for orchestration)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
